<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Répartition des GCP et check points sur une emprise drone</title>
  <desc id="desc">Plan simplifié montrant des points d'appui répartis aux coins et au centre, avec des check points indépendants.</desc>
  <rect width="1280" height="720" fill="#F7F5EF"/>
  <rect x="76" y="64" width="1128" height="592" rx="28" fill="#FFFFFF" stroke="#D8D2C2" stroke-width="2"/>
  <text x="116" y="124" fill="#181713" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Implantation GCP / check points</text>
  <text x="116" y="160" fill="#655F52" font-family="Inter, Arial, sans-serif" font-size="18">Le modèle doit être contraint partout, puis contrôlé par des points indépendants.</text>

  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#E3DED0" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="150" y="205" width="720" height="380" rx="22" fill="#FDFBF6" stroke="#CFC7B6" stroke-width="2"/>
    <rect x="176" y="231" width="668" height="328" rx="14" fill="url(#grid)" stroke="#DDD4C0"/>
    <path d="M220 515C285 465 330 497 390 450C475 382 526 420 590 350C660 274 732 318 800 258" stroke="#D1B98C" stroke-width="22" stroke-linecap="round" opacity="0.45"/>
    <path d="M220 515C285 465 330 497 390 450C475 382 526 420 590 350C660 274 732 318 800 258" stroke="#B68F4A" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 10"/>

    <g font-family="Inter, Arial, sans-serif" font-weight="700">
      <circle cx="215" cy="270" r="18" fill="#E39A2B" stroke="#6C4210" stroke-width="3"/>
      <text x="215" y="277" text-anchor="middle" fill="#FFFFFF" font-size="16">G</text>
      <circle cx="805" cy="270" r="18" fill="#E39A2B" stroke="#6C4210" stroke-width="3"/>
      <text x="805" y="277" text-anchor="middle" fill="#FFFFFF" font-size="16">G</text>
      <circle cx="215" cy="520" r="18" fill="#E39A2B" stroke="#6C4210" stroke-width="3"/>
      <text x="215" y="527" text-anchor="middle" fill="#FFFFFF" font-size="16">G</text>
      <circle cx="805" cy="520" r="18" fill="#E39A2B" stroke="#6C4210" stroke-width="3"/>
      <text x="805" y="527" text-anchor="middle" fill="#FFFFFF" font-size="16">G</text>
      <circle cx="510" cy="395" r="18" fill="#E39A2B" stroke="#6C4210" stroke-width="3"/>
      <text x="510" y="402" text-anchor="middle" fill="#FFFFFF" font-size="16">G</text>

      <circle cx="360" cy="300" r="15" fill="#2D6A6A" stroke="#143838" stroke-width="3"/>
      <text x="360" y="306" text-anchor="middle" fill="#FFFFFF" font-size="14">C</text>
      <circle cx="665" cy="505" r="15" fill="#2D6A6A" stroke="#143838" stroke-width="3"/>
      <text x="665" y="511" text-anchor="middle" fill="#FFFFFF" font-size="14">C</text>
      <circle cx="690" cy="330" r="15" fill="#2D6A6A" stroke="#143838" stroke-width="3"/>
      <text x="690" y="336" text-anchor="middle" fill="#FFFFFF" font-size="14">C</text>
    </g>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="925" y="230" width="220" height="78" rx="16" fill="#FFF2D8" stroke="#E2BF73"/>
    <circle cx="958" cy="269" r="14" fill="#E39A2B" stroke="#6C4210" stroke-width="3"/>
    <text x="958" y="275" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">G</text>
    <text x="986" y="264" fill="#181713" font-size="18" font-weight="700">GCP</text>
    <text x="986" y="287" fill="#655F52" font-size="14">contraint le modèle</text>

    <rect x="925" y="330" width="220" height="78" rx="16" fill="#E9F2EF" stroke="#AFCBC3"/>
    <circle cx="958" cy="369" r="14" fill="#2D6A6A" stroke="#143838" stroke-width="3"/>
    <text x="958" y="375" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">C</text>
    <text x="986" y="364" fill="#181713" font-size="18" font-weight="700">Check point</text>
    <text x="986" y="387" fill="#655F52" font-size="14">mesure l'erreur finale</text>

    <rect x="925" y="448" width="220" height="92" rx="16" fill="#F4EFE7" stroke="#D4C3A7"/>
    <text x="1035" y="480" text-anchor="middle" fill="#181713" font-size="18" font-weight="700">Bonne pratique</text>
    <text x="1035" y="508" text-anchor="middle" fill="#655F52" font-size="14">coins + centre</text>
    <text x="1035" y="530" text-anchor="middle" fill="#655F52" font-size="14">et contrôle indépendant</text>
  </g>
</svg>
